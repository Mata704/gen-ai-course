name: apollo-copilot

services:
  api:
    build:
      context: ../../..
      dockerfile: sessions/08-container-integration/starter/Dockerfile
    image: gen-ai-course-session8:local
    env_file:
      - ../../../.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  ui:
    image: gen-ai-course-session8:local
    command: ["streamlit", "run", "sessions/08-container-integration/starter/app/ui.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      COPILOT_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
