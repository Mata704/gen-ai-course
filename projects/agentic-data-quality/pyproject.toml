[project]
name = "agentic-data-quality"
version = "0.1.0"
description = "Local synthetic data-pipeline simulator for an agentic Data Quality project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
data-quality-sim = "data_quality_agent.simulator.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_quality_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
