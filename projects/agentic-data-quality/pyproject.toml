[project]
name = "agentic-data-quality"
version = "0.1.0"
description = "Local synthetic data-pipeline simulator for an agentic Data Quality project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp-slim[server]>=4.1",
    "pydantic>=2.0.0",
    "pydantic-ai-slim[openai]>=1.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
data-quality-sim = "data_quality_agent.simulator.cli:main"
data-quality-eval = "data_quality_agent.evaluation.cli:main"
data-quality-ui = "data_quality_agent.ui.launcher:main"
data-quality-mcp = "data_quality_agent.mcp.server:main"
data-quality-mcp-lock = "data_quality_agent.tools.platform_client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_quality_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
